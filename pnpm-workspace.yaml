catalogMode: prefer
ignoreWorkspaceRootCheck: true
shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - cached-factory@0.1.0
ignoreScripts: true
minimumReleaseAge: 5760 # 4 days
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - tests/fixtures/*

overrides:
  rolldown: 1.0.0-rc.12

catalogs:
  dev:
    "@eslint/config-inspector": 3.4.0
    "@types/node": 26.4.0
    "@typescript-eslint/rule-tester": 8.68.0
    chokidar: 5.0.0
    eslint-typegen: 2.3.1
    jiti: 2.7.0
    publint: 0.3.18
    semver: 7.8.5
    synckit: 0.11.13
    tsdown: 0.22.14
    tsx: 4.23.13
    typescript: 6.0.3
    vitest: 4.1.11

  inline:
    find-up-simple: 1.0.1

  peer:
    "@eslint-community/eslint-utils": 4.10.1
    "@eslint-react/eslint-plugin": 5.18.6
    "@prettier/plugin-xml": 3.4.2
    "@typescript-eslint/types": 8.68.0
    "@typescript-eslint/utils": 8.68.0
    "@unocss/eslint-plugin": 66.8.1
    astro-eslint-parser: 3.1.0
    eslint: 10.9.1
    eslint-plugin-astro: 3.1.0
    eslint-plugin-erasable-syntax-only: 0.7.1
    eslint-plugin-format: 2.0.1
    eslint-plugin-react-refresh: 0.5.5
    eslint-plugin-tailwindcss: 3.18.2
    prettier-plugin-astro: 0.14.1
    tailwindcss: 3.4.19
    unocss: 66.6.7
    vue: 3.5.42

  prod:
    "@antfu/install-pkg": 2.0.1
    "@clack/prompts": 1.7.0
    "@e18e/eslint-plugin": 0.8.0
    "@eslint-community/eslint-plugin-eslint-comments": 4.7.2
    "@eslint/markdown": 8.0.3
    "@stylistic/eslint-plugin": 5.10.0
    "@typescript-eslint/eslint-plugin": 8.68.0
    "@typescript-eslint/parser": 8.68.0
    "@vitest/eslint-plugin": 1.6.27
    eslint-config-flat-gitignore: 2.4.0
    eslint-flat-config-utils: 3.2.0
    eslint-merge-processors: 2.0.0
    eslint-plugin-antfu: 3.2.3
    eslint-plugin-command: 4.0.0
    eslint-plugin-import-lite: 0.6.0
    eslint-plugin-jsdoc: 64.3.2
    eslint-plugin-jsonc: 3.4.2
    eslint-plugin-n: 18.3.0
    eslint-plugin-perfectionist: 5.10.1
    eslint-plugin-pnpm: 1.9.1
    eslint-plugin-regexp: 3.2.0
    eslint-plugin-toml: 1.5.0
    eslint-plugin-unicorn: 74.0.0
    eslint-plugin-unused-imports: 4.4.1
    eslint-plugin-vue: 10.10.0
    eslint-plugin-yml: 3.8.1
    eslint-processor-vue-blocks: 2.0.0
    globals: 17.11.0
    local-pkg: 1.2.1
    parse-gitignore: 2.0.0
    toml-eslint-parser: 1.0.3
    vue-eslint-parser: 10.4.1
    yaml-eslint-parser: 2.1.0

